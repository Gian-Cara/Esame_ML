[pytest]
markers =
    mandatory: acceptance tests for the 3 mandatory services (user, event, registration)
    optional: acceptance tests for the optional services (feedback, notification)
    user: user-service acceptance tests
    event: event-service acceptance tests
    registration: registration-service acceptance tests
    feedback: feedback-service acceptance tests
    notification: notification-service acceptance tests
    e2e: end-to-end journeys across multiple services
    resilience: dependency-down / failure-mode acceptance tests
addopts = -ra
