openapi: 3.0.3
info:
  title: event-service
  description: >
    TechConf events (conferences) with lifecycle and capacity.
    Validates the organizer against user-service.
  version: "1.0.0"
servers:
  - url: http://localhost:5002
    description: Development
paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/events:
    post:
      summary: Create an event
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/MalformedJson"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    get:
      summary: List events
      operationId: listEvents
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EventStatus"
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/events/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get an event by id
      operationId: getEvent
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Replace an event
      operationId: replaceEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    patch:
      summary: Partially update an event
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    delete:
      summary: Delete an event
      operationId: deleteEvent
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    MalformedJson:
      description: Malformed JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation or business-rule error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DependencyUnavailable:
      description: A dependency service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string

    EventStatus:
      type: string
      enum: [draft, published, cancelled]

    EventCreate:
      type: object
      additionalProperties: false
      required:
        - title
        - organizer_id
        - venue
        - city
        - start_date
        - end_date
        - capacity
        - price
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 2000
          nullable: true
        organizer_id:
          type: string
          format: uuid
        venue:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 60
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        price:
          type: number
          minimum: 0
        status:
          $ref: "#/components/schemas/EventStatus"

    EventUpdate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 2000
          nullable: true
        organizer_id:
          type: string
          format: uuid
        venue:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 60
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        price:
          type: number
          minimum: 0
        status:
          $ref: "#/components/schemas/EventStatus"

    Event:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - organizer_id
        - venue
        - city
        - start_date
        - end_date
        - capacity
        - price
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        organizer_id:
          type: string
          format: uuid
        venue:
          type: string
        city:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        capacity:
          type: integer
        price:
          type: number
        status:
          $ref: "#/components/schemas/EventStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
