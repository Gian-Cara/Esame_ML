openapi: 3.0.3
info:
  title: feedback-service
  description: >
    TechConf feedback (ratings) on events by registered users.
    Validates registrations against registration-service and events against event-service.
  version: "1.0.0"
servers:
  - url: http://localhost:5004
    description: Development
paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/feedbacks:
    post:
      summary: Create feedback
      operationId: createFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackCreate"
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "400":
          $ref: "#/components/responses/MalformedJson"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    get:
      summary: List feedbacks
      operationId: listFeedbacks
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: event_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated list of feedbacks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackPage"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/feedbacks/summary:
    get:
      summary: Feedback summary for an event
      operationId: feedbackSummary
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Summary for the event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/feedbacks/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get feedback by id
      operationId: getFeedback
      responses:
        "200":
          description: The feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update feedback rating/comment
      operationId: updateFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackPatch"
      responses:
        "200":
          description: Updated feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Delete feedback
      operationId: deleteFeedback
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    MalformedJson:
      description: Malformed JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation or business-rule error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DependencyUnavailable:
      description: A dependency service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string

    FeedbackCreate:
      type: object
      additionalProperties: false
      required: [user_id, event_id, rating]
      properties:
        user_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
          nullable: true

    FeedbackPatch:
      type: object
      additionalProperties: false
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
          nullable: true

    Feedback:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - event_id
        - rating
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        rating:
          type: integer
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FeedbackPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Feedback"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    FeedbackSummary:
      type: object
      additionalProperties: false
      required: [event_id, count, average_rating]
      properties:
        event_id:
          type: string
          format: uuid
        count:
          type: integer
        average_rating:
          type: number
          nullable: true

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
