openapi: 3.0.3
info:
  title: notification-service
  description: >
    TechConf notifications to users, including broadcast to the confirmed
    registrants of an event. Validates users against user-service and
    registrations against registration-service.
  version: "1.0.0"
servers:
  - url: http://localhost:5005
    description: Development
paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/notifications:
    post:
      summary: Create a notification
      operationId: createNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCreate"
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/MalformedJson"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    get:
      summary: List notifications
      operationId: listNotifications
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NotificationStatus"
      responses:
        "200":
          description: Paginated list of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/notifications/broadcast:
    post:
      summary: Broadcast a notification to confirmed registrants of an event
      operationId: broadcastNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastCreate"
      responses:
        "201":
          description: Broadcast created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastResult"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/notifications/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get a notification by id
      operationId: getNotification
      responses:
        "200":
          description: The notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update notification status
      operationId: updateNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPatch"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Delete a notification
      operationId: deleteNotification
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    MalformedJson:
      description: Malformed JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation or business-rule error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DependencyUnavailable:
      description: A dependency service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string

    NotificationChannel:
      type: string
      enum: [email, sms, push]

    NotificationStatus:
      type: string
      enum: [queued, sent, failed]

    NotificationCreate:
      type: object
      additionalProperties: false
      required: [user_id, channel, subject, body]
      properties:
        user_id:
          type: string
          format: uuid
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        subject:
          type: string
          minLength: 1
          maxLength: 150
        body:
          type: string
          minLength: 1
          maxLength: 5000

    NotificationPatch:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/NotificationStatus"

    Notification:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - channel
        - subject
        - body
        - status
        - sent_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        subject:
          type: string
        body:
          type: string
        status:
          $ref: "#/components/schemas/NotificationStatus"
        sent_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    BroadcastCreate:
      type: object
      additionalProperties: false
      required: [event_id, channel, subject, body]
      properties:
        event_id:
          type: string
          format: uuid
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        subject:
          type: string
          minLength: 1
          maxLength: 150
        body:
          type: string
          minLength: 1
          maxLength: 5000

    BroadcastResult:
      type: object
      additionalProperties: false
      required: [event_id, created]
      properties:
        event_id:
          type: string
          format: uuid
        created:
          type: integer

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
